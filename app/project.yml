name: WheelFlip
options:
  bundleIdPrefix: com.jonywu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  WheelFlip:
    type: application
    platform: macOS
    sources:
      - path: WheelFlip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonywu.WheelFlip
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WheelFlip/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: WheelFlip/WheelFlip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconV2
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  WheelFlipTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: WheelFlip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonywu.WheelFlipTests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WheelFlip.app/Contents/MacOS/WheelFlip"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  WheelFlip:
    build:
      targets:
        WheelFlip: all
        WheelFlipTests: [test]
    test:
      config: Debug
      targets:
        - WheelFlipTests
    run:
      config: Debug
